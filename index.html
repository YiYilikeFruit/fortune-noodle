<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>幸运饭桶大转盘</title>
    <link rel="stylesheet" href="css/wheel.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>
        <svg
          class="bowl-icon"
          viewBox="0 0 24 24"
          width="22"
          height="22"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M3 11h18a9 9 0 0 1-4.6 7.9v1.1A1.5 1.5 0 0 1 14.9 21.5H9.1a1.5 1.5 0 0 1-1.5-1.5v-1.1A9 9 0 0 1 3 11Z"
            fill="#ffb300"
            stroke="#b8860b"
            stroke-width="1"
          />
          <path
            d="M8 8c0-2 1.5-2 1.5-4M12 8c0-2 1.5-2 1.5-4M16 8c0-2 1.5-2 1.5-4"
            stroke="#ffd700"
            stroke-width="1.4"
            stroke-linecap="round"
            fill="none"
          />
        </svg>
        幸运饭桶大转盘
      </h1>
      <p class="subtitle">下注 · 转起来 · 今天就吃它</p>
      <div id="round-progress" aria-label="轮次进度"></div>
      <div class="header-meta">
        <span id="status-bar" role="status"></span>
      </div>
    </header>

    <main class="app-main">
      <!-- 转盘区：盘面（37 格）+ 珠子（沿轨道滚动，无指针） -->
      <section id="wheel-section" aria-label="转盘区">
        <div id="wheel-wrap">
          <div id="wheel-ball-wrap" aria-hidden="true">
            <span id="wheel-ball"></span>
          </div>
          <div id="wheel-disc" aria-label="轮盘盘面"></div>
        </div>
      </section>

      <!-- 赌桌下注面板（红/黑/大/小 + 单号数字网格，JS 构建） -->
      <section id="bet-panel" aria-label="赌桌下注面板"></section>

      <!-- 收敛轨迹抽屉（默认收起；seed/rules 溯源元数据随抽屉展示） -->
      <section id="trace-section" aria-label="收敛轨迹">
        <button type="button" id="trace-toggle" aria-expanded="false">
          收敛轨迹
        </button>
        <div id="seed-info" class="trace-seed"></div>
        <ol id="trace-list" hidden></ol>
      </section>
    </main>

    <!-- 结果卡浮层（覆盖式，默认隐藏） -->
    <div id="result-card" hidden aria-label="结果卡"></div>

    <!-- 单号选择浮层（覆盖式，36 号大格 ≥44px 点击区） -->
    <div id="single-picker" hidden aria-label="单号选择">
      <div class="picker-box">
        <p class="picker-title">选择一个号码（0 号独立，不可押）</p>
        <div id="single-grid"></div>
        <button type="button" id="single-cancel">取消</button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
